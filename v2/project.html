<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project · Jack Pham</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <p class="crumb"><a href="index.html">Jack Pham</a> / <a href="index.html#projects">Projects</a></p>
</div>

<main class="wrap" id="page"></main>

<footer class="wrap">
  <a href="index.html">Home</a>
  <a href="mailto:jack_pham@berkeley.edu">Email</a>
  <a href="https://github.com/jackpham-rgb" target="_blank" rel="noopener">GitHub</a>
  <a href="../assets/JackPham-Resume-IC-Circuits.pdf" download>Resume</a>
</footer>

<script src="projects.js"></script>
<script>
  const id = new URLSearchParams(location.search).get('p');
  const p = PROJECTS.find(x => x.id === id);
  const page = document.getElementById('page');

  if (!p) {
    page.innerHTML = '<p style="padding:40px 0">Project not found. <a href="index.html#projects">Back to projects</a>.</p>';
  } else {
    document.title = p.title + ' · Jack Pham';
    let fig = 1;
    const figure = f => `<figure${f.wide ? ' class="wide"' : ''}><img src="${f.src}" alt="${f.cap}" loading="lazy"><figcaption><b>Fig. ${fig++}</b>${f.cap}</figcaption></figure>`;
    const paras = arr => arr.map(t => `<p>${t}</p>`).join('');
    const row = (k, html) => `<section class="row"><div class="k">${k}</div><div>${html}</div></section>`;

    const links = [`<a href="${p.repo}" target="_blank" rel="noopener">Code and full write-up on GitHub</a>`]
      .concat((p.links || []).map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`)).join('');

    const t = p.table;
    const table = `<table>
        <thead><tr>${t.head.map(h => `<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${t.rows.map(r => `<tr>${r.map((c, i) => i === 0 ? `<td>${c}</td>` : `<td class="num">${c}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>${t.note ? `<p class="table-note">${t.note}</p>` : ''}`;

    page.innerHTML = `
      <div class="p-head">
        <p class="kind">${p.kind} · ${p.year}</p>
        <h1>${p.title}</h1>
        <p class="line">${p.line}</p>
        <p class="links">${links}</p>
      </div>
      <div class="hero">${figure(p.hero)}</div>
      ${row('Problem', paras(p.problem))}
      ${row('Approach', `<div class="diagram">${p.diagram}</div>` + paras(p.approach))}
      ${row('Result', table + `<div style="margin-top:14px">${paras(p.result)}</div>`)}
      <div class="figs">${p.figures.map(figure).join('')}</div>
      ${row('What broke', paras(p.broke))}
      ${row('Learnt', paras(p.learnt))}
      ${row('Tools', `<p class="tools">${p.tools.join(' · ')}</p>`)}
    `;
    page.querySelectorAll('section.row').forEach(s => s.style.paddingTop = '30px');
  }
</script>
</body>
</html>
